<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex, nosnippet">
<meta name="description" content="Seleção de imagens de renderização e representação tridimensional desenvolvidas pela Intare Arquitetura.">
<title>Renderização e 3D — Intare Arquitetura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/lightbox.css">
<style>
  :root{--cream:#F6F1E7;--cream-2:#EFE8D9;--navy:#3B3A78;--navy-deep:#2A2959;--coral:#E4674B;--olive:#AEBB4E;--ink:#3A3630;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{background:var(--cream);color:var(--ink);font-family:'Work Sans',sans-serif;overflow-x:hidden;}
  img{display:block;max-width:100%;}
  a{color:inherit;}
  @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important;}}

  .site-header{max-width:1180px;margin:0 auto;padding:28px 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;}
  .back-link{justify-self:start;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);}
  .back-link::before{content:"←";font-size:1rem;transition:transform .2s ease;}
  .back-link:hover::before{transform:translateX(-4px);}
  .brand{grid-column:2;display:flex;flex-direction:column;align-items:center;text-decoration:none;text-align:center;}
  .skyline{width:58px;height:48px;}
  .skyline path{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;}
  .wordmark{font-family:'Jost',sans-serif;font-size:1.1rem;font-weight:500;letter-spacing:.22em;color:var(--navy);margin-left:.22em;}
  .sub-word{font-family:'Jost',sans-serif;font-size:.52rem;font-weight:300;letter-spacing:.42em;color:var(--ink);margin-left:.42em;}

  .project-hero{max-width:1180px;margin:0 auto;padding:70px 24px 76px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:clamp(42px,7vw,100px);align-items:end;border-top:1px solid rgba(59,58,120,.14);}
  .project-kicker{font-family:'Jost',sans-serif;font-size:.74rem;letter-spacing:.24em;text-transform:uppercase;color:var(--coral);font-weight:500;}
  h1{font-family:'Jost',sans-serif;font-size:clamp(3.2rem,8.3vw,7.2rem);font-weight:300;line-height:.92;color:var(--navy-deep);margin-top:14px;letter-spacing:.01em;}
  h1 em{font-style:normal;color:var(--coral);font-weight:600;}
  .project-summary{border-left:3px solid var(--olive);padding-left:24px;}
  .description{line-height:1.75;font-size:.98rem;color:#625c53;max-width:38ch;}


  .gallery{max-width:1180px;margin:0 auto;padding:110px 24px 120px;}
  .gallery-head{display:flex;align-items:baseline;justify-content:space-between;gap:20px;border-bottom:1px solid rgba(59,58,120,.18);padding-bottom:20px;margin-bottom:34px;}
  .gallery-head h2{font-family:'Jost',sans-serif;font-size:clamp(1.7rem,4vw,2.25rem);font-weight:400;color:var(--navy-deep);}
  .gallery-head span{font-family:'Jost',sans-serif;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);}
  .gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start;}
  figure{background:#fff;border-radius:16px;overflow:hidden;}
  figure img{width:100%;height:auto;transition:transform .4s ease;}
  figure:hover img{transform:scale(1.012);}
  figcaption{padding:14px 17px 16px;background:#fff;font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#746d62;}

  .next-project{border-top:1px solid rgba(59,58,120,.15);padding:54px 24px;text-align:center;}
  .next-project a{display:inline-flex;flex-direction:column;gap:7px;text-decoration:none;}
  .next-project span{font-family:'Jost',sans-serif;font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:var(--coral);}
  .next-project strong{font-family:'Jost',sans-serif;font-size:1.2rem;font-weight:400;color:var(--navy);}
  footer{text-align:center;padding:28px 24px 40px;font-size:.7rem;letter-spacing:.08em;color:#aaa092;text-transform:uppercase;}

  @media(max-width:720px){
    .site-header{grid-template-columns:1fr auto;padding-top:20px;}
    .brand{grid-column:2;}
    .back-link{grid-column:1;grid-row:1;}
    .project-hero{grid-template-columns:1fr;padding-top:46px;gap:34px;}
    .project-summary{max-width:520px;}
    .gallery{padding-top:78px;}
    .gallery-grid{grid-template-columns:1fr;}
  }
  @media(max-width:440px){.back-link{font-size:0;width:36px;}.back-link::before{font-size:1.25rem;}.skyline{width:48px;height:40px;}.wordmark{font-size:.95rem;}h1{font-size:3rem;}.gallery-head{align-items:flex-end;}}
</style>
</head>
<body>
  <header class="site-header">
    <a class="back-link" href="../index.html#projetos">Voltar aos projetos</a>
    <a class="brand" href="../index.html" aria-label="Intare Arquitetura — página inicial">
      <svg class="skyline" viewBox="0 0 180 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M14 128 V96 C14 84 22 74 34 74 C46 74 54 84 54 96 V128" stroke="#E4674B"/>
        <path d="M50 128 V38 C50 28 58 20 66 12 C74 20 82 28 82 38 V128" stroke="#3B3A78"/>
        <path d="M78 128 V66 C78 56 88 50 96 42 C104 50 114 56 114 66 V128" stroke="#AEBB4E"/>
      </svg>
      <span class="wordmark">i n t a r e</span>
      <span class="sub-word">arquitetura</span>
    </a>
  </header>

  <main>
    <section class="project-hero">
      <div>
        <p class="project-kicker">Imagens em 3D</p>
        <h1>Renderização <em>e 3D</em></h1>
      </div>
      <div class="project-summary">
        <p class="description">Seleção de imagens de renderização e representação tridimensional.</p>
      </div>
    </section>

    <section class="gallery" aria-labelledby="galeria-titulo">
      <div class="gallery-head">
        <h2 id="galeria-titulo">Imagens</h2>
        <span>Renderização e 3D</span>
      </div>
      <div class="gallery-grid">
        <figure><img src="../assets/images/clientes/renderizacao-e3d/img-1.png" alt="Renderização 1 — área de lazer residencial" loading="lazy"><figcaption>Imagem 1</figcaption></figure>
        <figure><img src="../assets/images/clientes/renderizacao-e3d/img-2.png" alt="Renderização 2 — perspectiva isométrica residencial" loading="lazy"><figcaption>Imagem 2</figcaption></figure>
        <figure><img src="../assets/images/clientes/renderizacao-e3d/img-3.png" alt="Renderização 3 — ambiente de escritório" loading="lazy"><figcaption>Imagem 3</figcaption></figure>
        <figure><img src="../assets/images/clientes/renderizacao-e3d/img-4.png" alt="Renderização 4 — dormitório" loading="lazy"><figcaption>Imagem 4</figcaption></figure>
        <figure><img src="../assets/images/clientes/renderizacao-e3d/img-5.png" alt="Renderização 5 — ambiente comercial" loading="lazy"><figcaption>Imagem 5</figcaption></figure>
        <figure><img src="../assets/images/clientes/renderizacao-e3d/img-6.png" alt="Renderização 6 — academia" loading="lazy"><figcaption>Imagem 6</figcaption></figure>
      </div>
    </section>

    <nav class="next-project" aria-label="Navegação entre projetos">
      <a href="../index.html#projetos"><span>Portfólio</span><strong>Ver todos os projetos</strong></a>
    </nav>
  </main>
  <footer>Intare Arquitetura · São José do Rio Preto — SP</footer>
  <script src="../assets/js/lightbox.js"></script>
</body>
</html>
